---
type: preprocessor
tune_mode: params
pipeline:
  - type: filter.gene
    target: FilterGenesScanpy
    params: 
      min_cells: 1
  - type: normalize
    target: NormalizeTotalLog1P
    params:
      target_sum: 1e4
  - type: feature.spatial
    target: MorphologyFeatureCNN
    params:
      n_components: 50
      device: cuda
      target_size: 230
    params_to_tune:
      crop_size: 
        values: [5,10,15]
  - type: feature.cell
    target: CellPCA
    params:
      out: feature.cell
      log_level: INFO
      n_components: 400
  - type: graph.spatial
    target: SMEGraph
    params:
      channels:
        - spatial
        - spatial_pixel
        - MorphologyFeatureCNN
        - feature.cell
  - type: feature.spatial
    target: SMEFeature
  - type: graph.cell
    target: NeighborGraph
    params:
      channel: SMEFeature
    params_to_tune:
      n_neighbors: 
        values: [5,10,15]
      n_pcs:
        values: [5,10]

  - type: misc
    target: SetConfig
    params:
      config_dict:
        feature_channel: NeighborGraph
        feature_channel_type: obsp
        label_channel: label
        label_channel_type: obs
wandb:
  entity: xzy11632
  project: dance-dev
  method: grid  # try grid to provide a comprehensive search
  metric:
    name: combined_score
    goal: maximize
