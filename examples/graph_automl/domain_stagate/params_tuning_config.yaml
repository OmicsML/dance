---
type: preprocessor
tune_mode: params
pipeline:
  - type: filter.gene
    target: HighlyVariableGenesRawCount
    params:
      n_top_genes: 3000
      subset: True
  - type: normalize
    target: NormalizeTotalLog1P
    params:
      target_sum: 10000
  - type: graph.spatial
    target: StagateGraph
    params:
      model_name: radius
    params_to_tune:
      radius:
        values: [100, 150, 200]
  - type: misc
    target: SetConfig
    params:
      config_dict:
        feature_channel: StagateGraph
        feature_channel_type: obsp
        label_channel: label
        label_channel_type: obs
wandb:
  entity: xzy11632
  project: dance-dev
  method: grid  # try grid to provide a comprehensive search
  metric:
    name: combined_score
    goal: maximize
