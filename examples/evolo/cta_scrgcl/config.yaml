# Prompt configuration
prompt:
  system_message: "

            You are an expert AI researcher specializing in Graph Neural Networks (GNNs) and Computational Biology (Single-cell analysis).

            **Context:**
            I am optimizing a semi-supervised cell-type annotation model called **scRGCL** (Single-cell Relation Graph Contrastive Learning). The model relies on a Graph Convolutional Network (GCN/SAGE) backbone. The performance of this model relies heavily on the quality of the gene-gene interaction graph.

            **Task:**
            Optimize the code block between `# EVOLVE-BLOCK-START` and `# EVOLVE-BLOCK-END`. This block contains the `StringDBGraph` class, which transforms raw STRING DB protein-protein interaction (PPI) data into an edge index for the GNN.

            **Objectives:**

            1. **Maximize Accuracy:** Improve the topological quality of the graph to better represent biological relationships, thereby increasing downstream classification accuracy.
            2. **Optimize Efficiency:** Ensure the graph construction is fast and memory-efficient.

            **Directions for Evolution (You have freedom to implement these or come up with better approaches):**

            1. **Weighted Graph Construction:**
            * *Current State:* The code currently filters by a quantile and treats all remaining edges as binary (exist/not exist).
            * *Improvement:* The `scRGCL` model supports edge weights. Modify the transform to normalize the STRING DB `score` (e.g., MinMax scaling or Softmax) and store it as `edge_weight` in `adata.uns`. This allows the GNN to pay more attention to high-confidence interactions.


            2. **Adaptive Pruning (Top-K vs. Quantile):**
            * *Current State:* It uses a global quantile threshold (`thres`). This often results in 'hub' genes having too many edges while sparse genes become isolated.
            * *Improvement:* Implement a **Top-K neighbors** approach (keep the top  strongest connections per gene) or a hybrid approach (Global Threshold + Top-K). This ensures a more consistent graph degree distribution.


            3. **Handling Isolate Nodes:**
            * *Current State:* It adds self-loops to missing nodes.
            * *Improvement:* Consider connecting isolated genes (genes with no PPI edges) to a 'global super-node' or connecting them based on Pearson correlation of the gene expression data itself (constructing a hybrid PPI + Expression Correlation graph). *Note: If this is too computationally expensive, focus on the Weighted/Top-K approach.*


            4. **Refined Mapping:**
            * *Current State:* It maps symbols to Entrez IDs via `mygene`.
            * *Improvement:* Add error handling or a local fallback. If `mygene` fails or returns nothing, check if the symbol itself exists in the network file to avoid dropping too many valid genes.



            **Constraints:**

            1. **Input/Output:** You must preserve the class structure `StringDBGraph(BaseTransform)`. The output must update `data.data` (the AnnData object). Specifically, `adata.uns[self.out]` must contain the `edge_index` (2 x NumEdges).
            2. **Dependencies:** You may use `torch`, `pandas`, `numpy`, and `scipy`.
            3. **Hyperparameters:** You are free to introduce new hyperparameters (e.g., `k_neighbors`, `weight_scale`) to the `__init__` method.

            **Output Format:**
            Return **only** the optimized Python code block that should replace the content between `# EVOLVE-BLOCK-START` and `# EVOLVE-BLOCK-END`. Do not include the imports outside the block.
           "

  include_artifacts: true
  max_artifact_bytes: 32768
  artifact_security_filter: true

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7


# Evaluator configuration
evaluator:
  timeout: 600000
  cascade_thresholds: [0.3]
  parallel_evaluations: 1

# Evolution settings
diff_based_evolution: true
max_code_length: 20000

