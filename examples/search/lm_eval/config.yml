max_iterations: 1
checkpoint_interval: 10
log_level: "INFO"

# LLM configuration
llm:
  models:
    - name: "qwen3-coder-plus"
      api_key: "sk-92265d8b2c044989b10ad59e3a27b56f"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      weight: 0.9
      temperature: 0.8
      max_tokens: 16000
      timeout: 1200
      top_p: 0.95
    - name: "deepseek-reasoner"
      api_key: "sk-acad184f8a7848918d7c9046affd1b65"
      api_base: "https://api.deepseek.com"
      weight: 0.1
      temperature: 0.8
      max_tokens: 16000
      timeout: 1200
      top_p: 0.95


# Prompt configuration
prompt:
  num_top_programs: 3
  use_template_stochasticity: true
  # System prompt is created dynamically during the benchmark in file system_message.txt!
  template_dir: "lm_eval/prompts"

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: false
  cascade_thresholds: [0.5, 0.75]
  parallel_evaluations: 4
  use_llm_feedback: true
  llm_feedback_weight: 1.0


# Evolution settings
diff_based_evolution: false
allow_full_rewrites: true
